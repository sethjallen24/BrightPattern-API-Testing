<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bright Pattern API Harness</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Bright Pattern CRM Embedded API Harness</h1>
    <form id="tenant-form">
      <label>Tenant host
        <input id="tenant" type="text" spellcheck="false" placeholder="clearinsights.brightpattern.com">
      </label>
      <label>integrationKey
        <input id="opt-key" type="text" spellcheck="false" placeholder="(random per load)">
      </label>
      <label class="check"><input id="opt-adaptive" type="checkbox"> adaptiveWidth</label>
      <label class="check"><input id="opt-no-popup" type="checkbox"> disableNewInteractionPopup</label>
      <label class="check"><input id="opt-standalone" type="checkbox"> standalone (no UI)</label>
      <button type="submit">Reload</button>
      <span id="adapter-status" class="badge">adapter: loading…</span>
    </form>
  </header>

  <main>
    <!-- The adapter mounts the Agent Desktop Comm.Widget iframe in here (mountRoot). -->
    <section id="widget-root"></section>

    <section id="control-pane">
      <details open>
        <summary>Session &amp; state</summary>
        <div class="row">
          <button data-call="getLoginState">getLoginState</button>
          <button data-call="openLogin">openLogin</button>
          <button data-call="logout">logout</button>
          <button data-call="getConfig">getConfig</button>
        </div>
        <div class="row">
          <button data-call="getAgentState">getAgentState</button>
          <button data-call="getAgentNotReadyReasons">getAgentNotReadyReasons</button>
          <button data-call="getInteractionsState">getInteractionsState</button>
        </div>
        <div class="row">
          <input id="agent-state" type="text" spellcheck="false" placeholder="state">
          <input id="agent-reason" type="text" spellcheck="false" placeholder="reason (optional)">
          <button data-call="setAgentState" data-args="#agent-state,#agent-reason">setAgentState</button>
        </div>
      </details>

      <details open>
        <summary>Lists</summary>
        <div class="row">
          <button data-call="getServicesList">getServicesList</button>
          <button data-call="getService">getService</button>
          <button data-call="getTeams">getTeams</button>
          <button data-call="getDIDNumbersList">getDIDNumbersList</button>
          <button data-call="getPhoneDevicesList">getPhoneDevicesList</button>
          <button data-call="getScreenRecordingState">getScreenRecordingState</button>
        </div>
      </details>

      <details open>
        <summary>Interactions</summary>
        <div class="row">
          <input id="call-number" type="text" spellcheck="false" placeholder="phone number">
          <button data-call="startCall" data-args="#call-number">startCall</button>
        </div>
        <div class="row">
          <input id="interaction-id" type="text" spellcheck="false" placeholder="interactionId">
        </div>
        <div class="row">
          <button data-call="acceptInteraction" data-args="#interaction-id">accept</button>
          <button data-call="rejectInteraction" data-args="#interaction-id">reject</button>
          <button data-call="switchActiveInteraction" data-args="#interaction-id">switchActive</button>
          <button data-call="leaveInteraction" data-args="#interaction-id">leave</button>
          <button data-call="completeInteraction" data-args="#interaction-id">complete</button>
        </div>
      </details>

      <details open>
        <summary>Any method</summary>
        <div class="row">
          <select id="method"></select>
          <button id="method-call">Call</button>
        </div>
        <div id="method-args" class="row"></div>
        <p class="muted">Values starting with <code>{ [ "</code> or equal to <code>true/false/null</code>
          are parsed as JSON; everything else is sent as a string. Empty trailing fields are omitted.</p>
      </details>

      <details>
        <summary>Events (* expects a response)</summary>
        <ul id="event-list" class="muted"></ul>
      </details>

      <div id="log-header">
        <strong>Log</strong>
        <span>
          <label class="inline"><input id="show-raw" type="checkbox"> raw protocol traffic</label>
          <button id="clear-log">Clear</button>
        </span>
      </div>
      <ol id="log"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
