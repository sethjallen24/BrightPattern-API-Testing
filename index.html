<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bright Pattern API Harness</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Bright Pattern CRM Embedded API Harness</h1>
    <form id="tenant-form">
      <label>Tenant host
        <input id="tenant" type="text" spellcheck="false" placeholder="clearinsights.brightpattern.com">
      </label>
      <label>Agent Desktop path
        <input id="desktop-path" type="text" spellcheck="false" placeholder="/agentdesktop/">
      </label>
      <button type="submit">Reload</button>
      <span id="adapter-status" class="badge">adapter: loading…</span>
    </form>
  </header>

  <main>
    <section id="desktop-pane">
      <iframe id="agent-desktop" title="Bright Pattern Agent Desktop"
              allow="microphone; camera; autoplay; clipboard-read; clipboard-write; display-capture"></iframe>
    </section>

    <section id="control-pane">
      <details open>
        <summary>Agent state</summary>
        <div class="row">
          <button data-call="getState" data-callback>getState</button>
        </div>
        <div class="row">
          <select id="status">
            <option>READY</option>
            <option>NOT_READY</option>
            <option>AFTER_CALL_WORK</option>
          </select>
          <input id="reason" type="text" placeholder="reason (optional)">
          <button id="set-status">setStatus</button>
        </div>
      </details>

      <details open>
        <summary>Dialing &amp; transfer</summary>
        <div class="row">
          <input id="number" type="text" placeholder="phone number">
          <button data-call="dialNumber" data-args="#number">dialNumber</button>
        </div>
        <div class="row">
          <input id="service" type="text" placeholder="service name">
          <button data-call="selectService" data-args="#service">selectService</button>
        </div>
        <div class="row">
          <input id="transfer-to" type="text" placeholder="destination">
          <button data-call="singleStepTransfer" data-args="#transfer-to">singleStepTransfer</button>
          <button data-call="singleStepConference" data-args="#transfer-to">singleStepConference</button>
        </div>
        <div class="row">
          <button data-call="mergeAllCallsIntoConference">mergeAllCallsIntoConference</button>
        </div>
      </details>

      <details open>
        <summary>Complete &amp; terminate</summary>
        <div class="row">
          <input id="disposition" type="text" placeholder="disposition">
          <input id="notes" type="text" placeholder="notes (optional)">
        </div>
        <div class="row">
          <button data-call="setDisposition" data-args="#disposition,#notes">setDisposition</button>
          <button data-call="completeInteractionWithDisp" data-args="#disposition,#notes">completeInteractionWithDisp</button>
        </div>
        <div class="row">
          <button data-call="terminateInteraction">terminateInteraction</button>
          <button data-call="completeInteraction">completeInteraction</button>
        </div>
      </details>

      <details open>
        <summary>Call recording</summary>
        <div class="row">
          <button data-call="startCallRecording">start</button>
          <button data-call="stopCallRecording">stop</button>
          <button data-call="muteCallRecording">mute</button>
          <button data-call="unmuteCallRecording">unmute</button>
        </div>
      </details>

      <details open>
        <summary>Any method (discovered on <code>bpspat.api</code>)</summary>
        <div class="row">
          <select id="generic-method"></select>
          <label class="inline"><input id="generic-callback" type="checkbox"> append callback</label>
        </div>
        <div class="row">
          <input id="generic-args" type="text" spellcheck="false" placeholder='JSON args array, e.g. ["NOT_READY", "Lunch"]'>
          <button id="generic-call">Call</button>
        </div>
        <div class="row">
          <button id="rescan">Rescan API</button>
          <span id="handler-summary" class="muted"></span>
        </div>
      </details>

      <div id="log-header">
        <strong>Log</strong>
        <button id="clear-log">Clear</button>
      </div>
      <ol id="log"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
